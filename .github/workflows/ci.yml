name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        extras: ["dev", "dev,shapiq", "dev,torch"]
        probly: [false]
        include:
          - extras: "dev"
            probly: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # CPU-only wheel: much smaller than the default CUDA build.
      - if: contains(matrix.extras, 'torch')
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[${{ matrix.extras }}]"
      # probly is not on PyPI in this version; pin the commit the bridge was verified against.
      - if: matrix.probly
        run: pip install "probly @ git+https://github.com/pwhofman/probly@2729f4f"
      - run: ruff check .
      - run: pytest -q
