[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shapiq-probly"
version = "0.2.0"
description = "Explain which features make a model uncertain, split into aleatoric and epistemic parts."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["numpy>=1.26", "scipy>=1.11", "scikit-learn>=1.4"]

[project.optional-dependencies]
plots = ["matplotlib>=3.8"]
shapiq = ["shapiq>=1.8"]
torch = ["torch>=2.2"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "matplotlib>=3.8"]

[tool.hatch.build.targets.wheel]
packages = ["src/shapiq_probly"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["shapiq_probly"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "D", "N", "SIM", "PL", "RUF"]
ignore = ["D102", "D105", "D107", "PLW3301", "N803", "N806", "PLR0913", "PLR2004"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "PLR"]
"examples/*" = ["D"]
